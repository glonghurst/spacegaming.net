<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05060a;color:#e8e2d2;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100dvh;
    background-image:radial-gradient(circle at 50% 0%, #12141c 0%, #05060a 62%);}
  header{position:sticky;top:0;z-index:5;background:rgba(5,6,10,.96);
    border-bottom:1px solid rgba(255,214,140,.16);padding:12px 14px;
    backdrop-filter:blur(6px)}
  .wordmark{font-size:10px;letter-spacing:.58em;text-indent:.58em;font-weight:700;
    text-transform:uppercase;color:#9a917f;text-align:center;margin-bottom:9px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,input,button{font-size:16px;font-family:inherit}
  select,input{background:rgba(255,255,255,.05);color:#f3e9d4;
    border:1px solid rgba(255,214,140,.28);border-radius:8px;padding:9px 11px;outline:none}
  select:focus,input:focus{border-color:rgba(255,214,140,.7)}
  input{flex:1;min-width:0}
  button{background:rgba(255,214,140,.09);color:#f3e9d4;border:1px solid rgba(255,214,140,.34);
    border-radius:8px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase}
  button:hover{background:rgba(255,214,140,.17)}
  button.on{background:#f3e9d4;color:#0a0c12;border-color:#f3e9d4}
  .meta{color:#7d776b;font-size:11px;letter-spacing:.06em}
  .demo{background:rgba(255,214,140,.09);border:1px solid rgba(255,214,140,.3);
    color:#f0dcae;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;text-align:center;padding:7px;border-radius:8px;margin:12px 14px 0}
  main{padding:14px}
  h2{font-size:10px;letter-spacing:.28em;color:#8b8579;text-transform:uppercase;
    margin:20px 0 9px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 13px;
    background:rgba(255,255,255,.04);cursor:pointer;font-size:15px;color:#cfc7b6;
    font-family:inherit}
  .chip .n{color:#6f6a60;font-size:11px;margin-left:6px}
  .chip.PROPER{color:#8fd6a8;border-color:rgba(143,214,168,.32)}
  .chip.TERM{color:#9dbbe8;border-color:rgba(157,187,232,.28)}
  .chip.on{outline:2px solid #f3e9d4}
  .seg{border:1px solid rgba(255,255,255,.09);border-radius:10px;
    background:rgba(255,255,255,.03);padding:10px 12px;margin-bottom:8px}
  .who{font-size:10px;color:#6f6a60;display:flex;gap:9px;flex-wrap:wrap;margin-bottom:5px;
    letter-spacing:.08em;text-transform:uppercase}
  .who .un{color:#d8a657}
  .tx{white-space:pre-wrap;line-height:1.5}
  mark{background:#3a5c8c;color:#fff;border-radius:3px;padding:0 2px}
  .red{color:#d2705f;font-weight:700}
  .note{color:#7d776b;padding:14px;border:1px dashed rgba(255,255,255,.12);border-radius:10px;
    font-size:13px;line-height:1.6}
  a.back{display:inline-block;margin:22px 0 30px;color:#b9ad95;font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;font-weight:700;text-decoration:none;

<body>
<header>
  <div class="wordmark">Space&nbsp;Gaming &middot; Hashpile</div>
  <div class="row">
    <select id="corpus" aria-label="Corpus"></select>
    <input id="q" placeholder="word, or  a + b  /  a | b  /  a - b" enterkeyhint="search" autocomplete="off">
    <button id="go">Find</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="shuffle">Shuffle</button>
    <select id="kind" aria-label="Word type">
      <option value="">all words</option>
      <option value="PROPER">names / places</option>
      <option value="TERM">other terms</option>
    </select>
    <button id="clean" title="Redact swearing from the lines below">Clean</button>
    <span class="meta" id="status">&nbsp;</span>
  </div>
</header>

<div class="demo">Demo &middot; sample data baked into this page &middot; no live connection</div>

<main>
  <h2>Word map</h2>
  <div class="chips" id="map"></div>
  <h2 id="rhead">Lines</h2>
  <div id="results"><div class="note">Tap a word above, or type one.<br><br>
    <b>a + b</b> both in the same line &middot; <b>a | b</b> either &middot; <b>a - b</b> a but not b<br>
    <b>Clean</b> redacts swearing from whatever is on screen.</div></div>

</main>

<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById('stub').textContent);
  var $ = function(s){ return document.querySelector(s); };
  var state = { corpus:'pubg', kind:'', word:null, clean:false, seed:0 };

  // Same wordlist idea as the server-side CLEAN, kept small and visible: this is
  // a demo of the INTERFACE, so the censoring must be inspectable rather than
  // impressive. Ambiguous drug slang is deliberately absent -- on the live
  // service those are reported and not muted, because "high" is where the
  // sniper is and "crack" is a crack shot.
  var SWEAR = /^(fuck\w*|shit\w*|cunt\w*|bastard|bollocks|wank\w*|prick|twat|arsehole|shite|bitch\w*|dick\w*)$/i;

  function esc(s){ return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function tt(s){ if(s==null) return '--'; var m=Math.floor(s/60), x=Math.floor(s%60);
    return m+':'+String(x).padStart(2,'0'); }

  function redact(text){
    return text.split(' ').map(function(w){
      var bare = w.replace(/[^A-Za-z']/g,'');
      return SWEAR.test(bare) ? '<span class="red">...</span>' : esc(w);
    }).join(' ');
  }

  function fillCorpora(){
    var sel = $('#corpus'); sel.innerHTML='';
    D.corpora.forEach(function(c){
      var o=document.createElement('option');
      o.value=c.id;
      // Unavailable piles are SHOWN with their reason, never hidden: omitting
      // WORK would tell the reader WORK does not exist, a different and false
      // claim from WORK being empty.
      o.textContent = c.available ? c.label : c.label+' \u2014 '+c.reason;
      o.disabled = !c.available;
      sel.appendChild(o);
    });
    sel.value = state.corpus;
  }

  function pool(){
    return D.vocab.filter(function(v){ return !state.kind || v.k===state.kind; });
  }

  function drawMap(){
    var p = pool(), pick;
    if(!state.seed){ pick = p.slice(0,28); }
    else {
      // Weighted by rank so shuffle reaches the tail. Resampling the head would
      // return nearly the same words and read as a control that does nothing.
      var s = state.seed, out=[], seen={}, i=0;
      function rnd(){ s = (s*1103515245 + 12345) & 0x7fffffff; return s/0x7fffffff; }
      while(out.length < Math.min(28,p.length) && i++ < 4000){
        var idx = Math.floor(Math.pow(rnd(), 1.7) * p.length);
        var v = p[idx]; if(v && !seen[v.w]){ seen[v.w]=1; out.push(v); }
      }
      pick = out;
    }
    var map = $('#map'); map.innerHTML='';
    pick.forEach(function(v){
      var b=document.createElement('button');
      b.className='chip '+v.k+(state.word===v.w?' on':'');
      b.innerHTML=esc(v.w)+'<span class="n">'+v.c+'\u00b7'+v.a+'</span>';
      b.onclick=function(){ run(v.w); };
      map.appendChild(b);
    });
    $('#status').textContent = pick.length+' of '+p.length+' terms';
  }

  function parse(q){
    var parts=q.toLowerCase().split(/\s*([+|,-])\s*/).filter(function(x){return x!=='';});
    var req=[],opt=[],exc=[],op=null;
    parts.forEach(function(p){
      if('+|,-'.indexOf(p)>=0 && p.length===1){ op=p; return; }
      p.split(/\s+/).forEach(function(w){
        w=w.replace(/'/g,''); if(!w) return;
        if(op==='+') req.push(w); else if(op==='-') exc.push(w); else opt.push(w);
        op=null;
      });
    });
    if(req.length && opt.length){ req=opt.concat(req); opt=[]; }
    return {req:req,opt:opt,exc:exc,mode:req.length?'and':(opt.length>1?'or':'single')};
  }

  function run(q){
    if(!q) return;
    var p = parse(q);
    state.word = (p.req[0]||p.opt[0]||null);
    $('#q').value = q;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
      c.classList.toggle('on', c.textContent.indexOf(state.word)===0); });

    function key(h){ return h.a+'@'+h.s; }
    var hits=[], i;
    if(p.req.length){
      var sets = p.req.map(function(t){ return D.post[t]||[]; });
      if(sets.some(function(s){ return !s.length; })) hits=[];
      else {
        var first={}; sets[0].forEach(function(h){ first[key(h)]=h; });
        var common=Object.keys(first);
        for(i=1;i<sets.length;i++){
          var ks={}; sets[i].forEach(function(h){ ks[key(h)]=1; });
          common = common.filter(function(k){ return ks[k]; });
        }
        hits = common.map(function(k){ return first[k]; });
      }
    } else {
      var merged={};
      p.opt.forEach(function(t){ (D.post[t]||[]).forEach(function(h){ merged[key(h)]=h; }); });
      hits = Object.keys(merged).map(function(k){ return merged[k]; });
    }
    if(p.exc.length){
      var bad={};
      p.exc.forEach(function(t){ (D.post[t]||[]).forEach(function(h){ bad[key(h)]=1; }); });
      hits = hits.filter(function(h){ return !bad[key(h)]; });
    }

    var out=$('#results');
    if(!hits.length){
      out.innerHTML = '<div class="note">'+(p.mode==='and'
        ? 'No single line contains <b>all</b> of '+esc(p.req.join(' + '))+'. Try <b>|</b> for either.'
        : 'Nothing in the sample contains \u201c'+esc(q)+'\u201d.')+'</div>';
      $('#rhead').textContent='Lines \u2014 0';
      return;
    }
    var terms = (p.req.length?p.req:p.opt);
    var re = new RegExp('\\b('+terms.map(function(t){
      return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|')+')\\b','ig');
    out.innerHTML = hits.map(function(h){
      var body = state.clean ? redact(h.t) : esc(h.t).replace(re, function(m){ return '<mark>'+m+'</mark>'; });
      return '<div class="seg"><div class="who"><span>clip \u2026'+esc(h.a)+'</span>'+
        '<span>'+tt(h.s)+'\u2013'+tt(h.e)+'</span>'+
        '<span class="un">unattributed</span></div><div class="tx">'+body+'</div></div>';
    }).join('');
    $('#rhead').textContent='Lines \u2014 \u201c'+q+'\u201d ('+hits.length+')';
  }

  $('#corpus').onchange=function(e){ state.corpus=e.target.value; state.seed=0; drawMap(); };
  $('#kind').onchange=function(e){ state.kind=e.target.value; state.seed=0; drawMap(); };
  $('#shuffle').onclick=function(){ state.seed=(Date.now()%100000)+1; drawMap(); };
  $('#clean').onclick=function(){
    state.clean=!state.clean;
    $('#clean').classList.toggle('on', state.clean);
    if(state.word) run($('#q').value.trim());
  };
  $('#go').onclick=function(){ run($('#q').value.trim().toLowerCase()); };
  $('#q').addEventListener('keydown', function(e){ if(e.key==='Enter') $('#go').click(); });

  fillCorpora(); drawMap();
})();
</script>
